[project]
name = "langchain-autotools"
# Placeholder. The real version comes from the git tag: the release workflow
# runs `poetry version $TAG` before building, so this value is never published.
version = "0.0.0"
description = "Automatic LangChain Tool and Toolkit creation from any Python SDK!"
authors = [{ name = "James Barney", email = "james@southendsolutions.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["langchain", "tools", "toolkit", "agents", "sdk", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
]

[project.urls]
Homepage = "https://github.com/Barneyjm/langchain-autotools"
Repository = "https://github.com/Barneyjm/langchain-autotools"
Changelog = "https://github.com/Barneyjm/langchain-autotools/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "langchain_autotools" }]
include = [{ path = "langchain_autotools/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
langchain = ">=1.0,<2.0"
ruff = ">=0.14,<0.15"
pytest = ">=8.3,<9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
